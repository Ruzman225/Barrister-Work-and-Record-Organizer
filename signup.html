<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up - Barrister Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Barrister Organizer</a>
        <div><a href="login.html">Login</a></div>
    </nav>

    <div class="form-container">
        <div class="card">
            <h2>Join the Firm</h2>
            <p style="color:#666; font-size:0.9rem;">Start managing cases efficiently</p>
            <form id="signupForm">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Create Password" required>
                <button type="submit">Create Account</button>
            </form>
            <p style="margin-top:15px; font-size:0.8rem;">
                Already a member? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const fullName = document.querySelector('input[placeholder="Full Name"]').value;
            const email = document.querySelector('input[placeholder="Email Address"]').value;
            const password = document.querySelector('input[placeholder="Create Password"]').value;

            try {
                const response = await fetch('http://localhost:3000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });

                if (response.ok) {
                    alert("Account Created! Redirecting to Login...");
                    window.location.href = "login.html";
                } else {
                    const data = await response.json();
                    alert("Error: " + (data.error || "Signup Failed"));
                }
            } catch (err) {
                alert("Server Error: Make sure node server.js is running!");
            }
        });
    </script>
</body>
</html>
