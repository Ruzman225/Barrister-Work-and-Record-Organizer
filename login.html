<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Barrister Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Barrister Organizer</a>
        <div><a href="signup.html">Create Account</a></div>
    </nav>

    <div class="form-container">
        <div class="card">
            <h2>Welcome Back</h2>
            <p style="color:#666; font-size:0.9rem;">Access your legal records</p>
            <form id="loginForm">
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Secure Login</button>
            </form>
            <p style="margin-top:15px; font-size:0.8rem;">
                New here? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    // Save email so we know who logged in
                    localStorage.setItem("userEmail", email);
                    window.location.href = "dashboard.html";
                } else {
                    alert("Invalid Login Details");
                }
            } catch (err) {
                alert("Server Error: Is the backend running?");
            }
        });
    </script>
</body>
</html>
